name: clang-tidy

# clang-tidy over the OpenToonz sources, with the checks of /.clang-tidy.
# The build runs first (sccache) so that the Qt generated files exist.

on:
  workflow_dispatch:
    inputs:
      paths:
        description: 'Only files whose path matches this regex (empty = all)'
        default: ''

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  tidy:
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64
      BOOST_TOOLSET: "14.3"
      BOOST_VERSION: "1.87.0"
      BOOST_ROOT: C:\local\boost_1_87_0
      OPENCV_VERSION: "4.13.0"
      OpenCV_DIR: C:\tools\opencv\build
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Cache OpenCV and Boost
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\opencv
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-${{ env.BOOST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-

      - name: Install OpenCV and Boost if cache is missing
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          choco install opencv --version=${{ env.OPENCV_VERSION }} -y
          choco install boost-msvc-${{ env.BOOST_TOOLSET }} --version=${{ env.BOOST_VERSION }} -y
        shell: cmd

      - name: Install custom Qt 5.15.2 with WinTab support
        run: |
          mkdir thirdparty\qt
          curl -fsSL -o Qt5.15.2_wintab.zip https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
          7z x Qt5.15.2_wintab.zip
          move Qt5.15.2_wintab\5.15.2_wintab thirdparty\qt
        shell: cmd

      - name: Install third-party prebuilt libs (LFS workaround)
        run: |
          curl -fsSL -o thirdparty-libs.zip https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip
          7z x -y thirdparty-libs.zip
        shell: cmd

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.29

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: CMake configuration
        run: |
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h || exit /b 1
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h || exit /b 1
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h || exit /b 1
          cd ..\toonz
          mkdir build
          cd build
          set EXTRA=-DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake ..\sources -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl %EXTRA% -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y -DWITH_TRANSLATION=OFF || exit /b 1
        shell: cmd

      - name: Build
        run: |
          cd toonz\build
          ninja || exit /b 1
        shell: cmd

      - name: clang-tidy version
        run: |
          where clang-tidy || choco install llvm -y
          echo C:\Program Files\LLVM\bin>> %GITHUB_PATH%
        shell: cmd

      - name: Run clang-tidy
        run: |
          clang-tidy --version
          python .github/scripts/run_tidy.py toonz/build "${{ inputs.paths }}" clang-tidy.log

      - name: Convert to SARIF
        if: always()
        run: python .github/scripts/sarif.py tidy clang-tidy.log "${{ github.workspace }}" clang-tidy.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: clang-tidy.sarif
          category: clang-tidy

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clang-tidy-${{ github.sha }}
          path: |
            clang-tidy.sarif
            clang-tidy.log
          retention-days: 30
