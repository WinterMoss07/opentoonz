name: Artifact to branch

# Copies the artifacts of a run to a branch, so that they can be fetched
# with git

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id'
        required: true
      pattern:
        description: 'Artifact name pattern'
        default: 'Opentoonz-symbols-*'
      branch:
        description: 'Target branch'
        default: 'analysis-symbols'

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: ${{ inputs.pattern }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
      - name: Push
        run: |
          mkdir out && cd out
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          find ../dl -type f -exec cp {} . \;
          ls -l
          git add -A
          git commit -q -m "artifacts of run ${{ inputs.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/${{ inputs.branch }}
